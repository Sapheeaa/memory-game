<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>memory game</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="icon" href="favicon.png" type="image/x-icon" />
  </head>
  <body>
    <!-- Модальное окно победы -->
    <div class="modal">
      <div class="modal-overlay" id="win-modal">
        <div class="modal-content">
          <h2>Congratulations!</h2>
          <p>You matched all pairs! Which one is your favorite?</p>
          <div class="modal-buttons">
            <span id="final-moves-count">0</span>
            <button class="btn btn-reset" id="modalNewGameBtn">Restart</button>
            <button class="btn btn-close" id="modalCloseGameBtn">Close</button>
          </div>
        </div>
      </div>
    </div>
  </body>
  <script src="script.js"></script>
</html>
